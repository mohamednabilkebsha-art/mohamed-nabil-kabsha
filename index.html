const setP = (o,p,v) => { const ks=p.split("."); let a=o; ks.slice(0,-1).forEach(k=>{ if(a[k]==null||typeof a[k]!=="object") a[k]={}; a=a[k]; }); a[ks[ks.length-1]]=v; };

function fieldHTML(f, val){
  const lab = `<label>${esc(L(f.l))}</label>`, n = esc(f.k);
  switch(f.t){
    case "text": case "url": case "date": return `<div class="field">${lab}<input class="gin" name="${n}" type="${f.t==="date"?"date":"text"}" value="${esc(val||"")}" ${f.t==="url"?'dir="ltr"':""}></div>`;
    case "color": return `<div class="field">${lab}<input class="gin" name="${n}" type="color" value="${esc(val||"#000000")}" style="height:48px;padding:4px"></div>`;
    case "check": return `<div class="field"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="${n}" ${val?"checked":""}> ${esc(L(f.l))}</label></div>`;
    case "select": return `<div class="field">${lab}<select class="gin" name="${n}">${OPT[f.o].map(([v,k])=>`<option value="${v}" ${val===v?"selected":""}>${esc(T[lang][k]||k)}</option>`).join("")}</select></div>`;
    case "bi": case "biarea": { const v=val||{}; const tag=f.t==="bi"?"input":"textarea";
      const mk=(lg)=> tag==="input" ? `<input class="gin" name="${n}.${lg}" dir="${lg==="ar"?"rtl":"ltr"}" placeholder="${t(lg)}" value="${esc(v[lg]||"")}">` : `<textarea class="gin" name="${n}.${lg}" dir="${lg==="ar"?"rtl":"ltr"}" placeholder="${t(lg)}">${esc(v[lg]||"")}</textarea>`;
      return `<div class="field">${lab}<div class="bi">${mk("ar")}${mk("en")}</div></div>`; }
    case "image": return `<div class="field">${lab}<div class="up">${val?`<img src="${asset(val)}" alt="">`:`<div style="width:88px;height:88px;border-radius:12px;background:rgba(255,255,255,.05)"></div>`}<input type="hidden" name="${n}" value="${esc(val||"")}"><label class="gbtn sm">${I.plus}${t("upload")}<input type="file" accept="image/*" data-up="image" data-for="${n}" hidden></label>${val?`<button type="button" class="gbtn sm danger" data-clear="${n}">${t("remove")}</button>`:""}<span class="fname" data-st="${n}"></span></div></div>`;
    case "file": { const fn = f.k+"Name"; return `<div class="field">${lab}<div class="up"><span style="color:var(--c2)">${I.file.replace('<svg','<svg width="34" height="34"')}</span><input type="hidden" name="${n}" value="${esc(val||"")}"><input type="hidden" name="${esc(fn)}" value="${esc(f._name||"")}"><span class="fname" data-st="${n}">${esc(f._name||(val?"✓":""))}</span><label class="gbtn sm">${I.plus}${t("upload")}<input type="file" accept="application/pdf,image/*" data-up="file" data-for="${n}" data-name-for="${esc(fn)}" hidden></label>${val?`<button type="button" class="gbtn sm danger" data-clear="${n}">${t("remove")}</button>`:""}</div></div>`; }
    case "media": { const arr = Array.isArray(val)?val:[];
      return `<div class="field">${lab}<input type="hidden" name="${n}" value="${esc(JSON.stringify(arr))}" data-json><div class="up" style="flex-direction:column;align-items:stretch"><div class="mlist" data-ml="${n}">${arr.map((m,i)=>`<div class="mitem">${m.type==="video"?`<video src="${asset(m.url)}" muted></video>`:`<img src="${asset(m.url)}" alt="">`}<button type="button" data-mrm="${n}" data-i="${i}" aria-label="${t("remove")}">×</button></div>`).join("")}</div><div style="display:flex;gap:10px;align-items:center"><label class="gbtn sm">${I.plus}${t("addMedia")}<input type="file" accept="image/*,video/mp4,video/webm" multiple data-up="media" data-for="${n}" hidden></label><span class="fname" data-st="${n}"></span></div></div></div>`; }
  }
  return "";
}
function readForm(form, fields, base){
  const out = JSON.parse(JSON.stringify(base||{}));
  fields.forEach(f=>{
    if(f.t==="bi"||f.t==="biarea"){ setP(out, f.k, {ar: form.elements[f.k+".ar"].value.trim(), en: form.elements[f.k+".en"].value.trim()}); }
    else if(f.t==="check"){ setP(out, f.k, form.elements[f.k].checked); }
    else if(f.t==="media"){ try{ setP(out, f.k, JSON.parse(form.elements[f.k].value||"[]")); }catch(e){ setP(out,f.k,[]); } }
    else if(f.t==="file"){ setP(out, f.k, form.elements[f.k].value); const fnk = f.k+"Name"; if(form.elements[fnk]) setP(out, fnk, form.elements[fnk].value); }
    else setP(out, f.k, form.elements[f.k].value.trim());
  });
  return out;
}

async function compressImage(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type) || (!STATIC_BUILD && file.size < 350*1024)) return file;
  try{
    const bmp = await createImageBitmap(file);
    const max = STATIC_BUILD ? 1400 : 2000, sc = Math.min(1, max/Math.max(bmp.width,bmp.height));
    const c = document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const keepAlpha = file.type==="image/png";
    const blob = await new Promise(r=>c.toBlob(r, "image/webp", keepAlpha?0.9:(STATIC_BUILD?0.78:0.85)));
    return blob && blob.size < file.size ? blob : file;
  }catch(e){ return file; }
}
async function uploadFile(file){
  if(!caps.assets) throw {code:"no_assets"};
  if(STATIC_BUILD && file.size > 15*1024*1024 && !file.type.startsWith("image/")) throw {message: lang==="ar"?"الملف أكبر من 15MB — صغّره الأول":"File is over 15MB — please compress it first"};
  const blob = file.type.startsWith("image/") ? await compressImage(file) : file;
  const r = await caps.assets.upload(blob, blob.type ? undefined : {type:file.type||"application/octet-stream"});
  return r.url || ("/_blob/" + r.id);
}
function wireUploads(form){
  form.addEventListener("change", async e=>{
    const inp = e.target; if(!inp.matches("input[type=file][data-up]")) return;
    const key = inp.dataset.for, st = form.querySelector(`[data-st="${CSS.escape(key)}"]`);
    if(!caps.assets){ st.textContent = t("cantUpload"); st.style.color="#fca5a5"; return; }
    const files = Array.from(inp.files||[]); if(!files.length) return;
    st.innerHTML = `<span class="spin"></span> ${t("uploading")}`;
    try{
      if(inp.dataset.up==="media"){
        const hid = form.elements[key]; const arr = JSON.parse(hid.value||"[]");
        for(const f of files){ const url = await uploadFile(f); arr.push({type:f.type.startsWith("video/")?"video":"image", url}); }
        hid.value = JSON.stringify(arr);
        form.querySelector(`[data-ml="${CSS.escape(key)}"]`).innerHTML = arr.map((m,i)=>`<div class="mitem">${m.type==="video"?`<video src="${asset(m.url)}" muted></video>`:`<img src="${asset(m.url)}" alt="">`}<button type="button" data-mrm="${esc(key)}" data-i="${i}">×</button></div>`).join("");
        st.textContent = "✓";
      } else {
        const f = files[0]; const url = await uploadFile(f);
        form.elements[key].value = url;
        if(inp.dataset.nameFor && form.elements[inp.dataset.nameFor]) form.elements[inp.dataset.nameFor].value = f.name;
        const prev = inp.closest(".up").querySelector("img");
        if(prev && inp.dataset.up==="image") prev.src = url; else if(inp.dataset.up==="image"){ const ph = inp.closest(".up").firstElementChild; ph.outerHTML = `<img src="${esc(url)}" alt="">`; }
        st.textContent = "✓ " + f.name;
      }
    }catch(err){ st.textContent = (err&&err.code==="no_assets")?t("cantUpload"):("⚠ "+(err&&(err.message||err.code)||"error")); st.style.color="#fca5a5"; }
    inp.value = "";
  });
  form.addEventListener("click", e=>{
    const c = e.target.closest("[data-clear]"); if(c){ e.preventDefault(); const k=c.dataset.clear; form.elements[k].value=""; const up=c.closest(".up"); const im=up.querySelector("img"); if(im) im.remove(); const st=up.querySelector("[data-st]"); if(st) st.textContent=""; c.remove(); return; }
    const r = e.target.closest("[data-mrm]"); if(r){ e.preventDefault(); const k=r.dataset.mrm, hid=form.elements[k]; const arr=JSON.parse(hid.value||"[]"); arr.splice(+r.dataset.i,1); hid.value=JSON.stringify(arr); r.parentElement.remove(); form.querySelectorAll(`[data-mrm="${CSS.escape(k)}"]`).forEach((b,i)=>b.dataset.i=i); }
  });
}

function openEditor(col, id, preset){
  const fields = SCHEMA[col]; const list = S[col];
  let item = id ? list.find(x=>x.id===id) : null;
  const isNew = !item;
  if(isNew){ item = {id: uid(col[0])}; if(col==="posts"){ item.section = preset||"work"; item.date = new Date().toISOString().slice(0,10); item.media=[]; } if(col==="artworks") item.cat="painting"; if(col==="projects") item.cat="web"; if(col==="designs") item.cat="logo"; if(col==="training") item.status="done"; if(col==="contacts") item.type="web"; }
  const fs = fields.map(f=> f.t==="file" ? Object.assign({}, f, {_name:item[f.k+"Name"]||""}) : f);
  const m = openModal(`<h2><span>${isNew?t("add"):t("edit")} — ${t(colTitle[col]||col)}</span><button class="icon-btn" data-act="close" aria-label="${t("close")}">${I.x}</button></h2>
    <form class="form" id="edf">${fs.map(f=>fieldHTML(f, getP(item,f.k))).join("")}
    ${caps.assets?"":`<p class="note">${t("cantUpload")}</p>`}
    <div class="cta"><button class="gbtn gold" type="submit">${I.save}${t("apply")}</button><button class="gbtn" type="button" data-act="close">${t("cancel")}</button></div></form>`, true);
  const form = m.querySelector("#edf"); wireUploads(form);
  form.addEventListener("submit", ev=>{
    ev.preventDefault();
    const out = readForm(form, fs, item);
    if(isNew) (col==="posts"? list.unshift(out) : list.push(out)); else list[list.indexOf(item)] = out;
    closeModal(); markDirty();
  });
}
function confirmDel(col, id){
  const m = openModal(`<h2>${t("confirmDel")}</h2><div class="cta"><button class="gbtn danger" data-yes style="background:rgba(239,68,68,.35)">${I.trash}${t("yes")}</button><button class="gbtn" data-act="close">${t("cancel")}</button></div>`);
  m.querySelector("[data-yes]").addEventListener("click", ()=>{ S[col] = S[col].filter(x=>x.id!==id); closeModal(); markDirty(); });
}
function openEdu(){
  const fs=[{k:"degree",t:"bi",l:{ar:"الدرجة",en:"Degree"}},{k:"uni",t:"bi",l:{ar:"الجامعة",en:"University"}},{k:"period",t:"text",l:{ar:"الفترة",en:"Period"}},{k:"project",t:"bi",l:{ar:"مشروع التخرج",en:"Graduation project"}},{k:"accr",t:"biarea",l:{ar:"الاعتماد",en:"Accreditation"}}];
  const m = openModal(`<h2><span>${t("education")}</span><button class="icon-btn" data-act="close">${I.x}</button></h2><form class="form" id="edf">${fs.map(f=>fieldHTML(f,getP(S.education,f.k))).join("")}${fieldHTML({k:"uniLogo",t:"image",l:{ar:"لوجو الجامعة (PNG شفاف يفضّل)",en:"University logo (transparent PNG preferred)"}}, S.settings.uniLogo)}<div class="cta"><button class="gbtn gold" type="submit">${t("apply")}</button></div></form>`, true);
  const form=m.querySelector("#edf"); wireUploads(form);
  form.addEventListener("submit",ev=>{ ev.preventDefault(); S.education = readForm(form, fs, S.education); S.settings.uniLogo = form.elements.uniLogo.value; closeModal(); markDirty(); });
}
function openSettings(tab){
  tab = tab || "brand";
  const tabs = ["brand","photos","texts","cv","colors","contacts"];
  const TF = {
    brand:[{k:"settings.logo",t:"image",l:{ar:"اللوجو الرئيسي",en:"Main logo"}},{k:"settings.logoMark",t:"image",l:{ar:"أيقونة شريط التنقل",en:"Navigation mark"}},{k:"settings.artLogo",t:"image",l:{ar:"لوجو Mohamed Nabil Art",en:"Mohamed Nabil Art logo"}},{k:"settings.brand",t:"text",l:{ar:"اسم العلامة في شريط التنقل",en:"Brand name in navigation"}}],
    photos:[{k:"settings.heroPhoto",t:"image",l:{ar:"صورتي في الرئيسية",en:"Home portrait"}},{k:"settings.careerPhoto",t:"image",l:{ar:"صورتي في صفحة العمل",en:"Career page portrait"}},{k:"settings.artHero",t:"image",l:{ar:"صورة غلاف صفحة الفن",en:"Art page cover"}},{k:"settings.artPhoto",t:"image",l:{ar:"صورتي الفنية (حكايتي مع الفن)",en:"Artistic portrait (art story)"}},{k:"settings.uniLogo",t:"image",l:{ar:"لوجو الجامعة",en:"University logo"}}],
    texts:[{k:"text.name",t:"bi",l:{ar:"الاسم",en:"Name"}},{k:"text.role1",t:"bi",l:{ar:"المسمى 1",en:"Title 1"}},{k:"text.role2",t:"bi",l:{ar:"المسمى 2",en:"Title 2"}},{k:"text.intro",t:"biarea",l:{ar:"المقدمة (الرئيسية)",en:"Intro (home)"}},{k:"text.careerAbout",t:"biarea",l:{ar:"نبذة عن العمل",en:"About my work"}},{k:"text.current",t:"bi",l:{ar:"ماذا أعمل حاليًا",en:"What I'm doing now"}},{k:"settings.expSince",t:"text",l:{ar:"بداية الخبرة (سنة)",en:"Experience since (year)"}},{k:"text.artTagline",t:"bi",l:{ar:"شعار صفحة الفن",en:"Art page headline"}},{k:"text.artAbout",t:"biarea",l:{ar:"حكايتي مع الفن",en:"My story with art"}},{k:"settings.artSince",t:"text",l:{ar:"بداية الفن (سنة)",en:"Art since (year)"}}],
    cv:[{k:"settings.cvFile",t:"file",l:{ar:"ملف السيرة الذاتية PDF",en:"CV PDF file"},_name:S.settings.cvName},{k:"settings.cvThumb",t:"image",l:{ar:"صورة مصغّرة للـ CV",en:"CV thumbnail"}},{k:"settings.cvUpdated",t:"text",l:{ar:"تاريخ التحديث",en:"Updated date"}}],
    colors:[{k:"settings.c1",t:"color",l:{ar:"اللون الأزرق (أساسي)",en:"Primary (blue)"}},{k:"settings.c2",t:"color",l:{ar:"اللون الذهبي (ثانوي)",en:"Accent (gold)"}},{k:"settings.bg",t:"color",l:{ar:"لون الخلفية",en:"Background"}}]
  };
  const tabNames = {brand:"brandTab",photos:"photosTab",texts:"textsTab",cv:"cvTab",colors:"colorsTab",contacts:"contactsTab"};
  let body;
  if(tab==="contacts"){
    body = `<div class="grid" style="gap:10px">${S.contacts.map(c=>`<div class="glass citem" style="--hc:${ICOLOR[c.type]||"var(--c1)"};justify-content:space-between"><div style="display:flex;gap:12px;align-items:center;min-width:0"><span class="ic">${I[c.type]||I.web}</span><span style="min-width:0"><small>${esc(L(c.label))}</small><span>${esc(c.value)}</span></span></div><div style="display:flex;gap:6px"><button class="icon-btn" data-act="edit" data-col="contacts" data-id="${esc(c.id)}">${I.edit}</button><button class="icon-btn" data-act="del" data-col="contacts" data-id="${esc(c.id)}" style="--hc:#ef4444">${I.trash}</button></div></div>`).join("")}</div><div class="cta" style="margin-top:14px">${addBtn("contacts")}</div>`;
  } else {
    const fs = TF[tab];
    body = `<form class="form" id="stf">${fs.map(f=>fieldHTML(f.k==="settings.cvFile"?Object.assign({},f,{k:"settings.cvFile"}):f, getP(S,f.k))).join("")}${caps.assets?"":`<p class="note">${t("cantUpload")}</p>`}<div class="cta"><button class="gbtn gold" type="submit">${I.save}${t("apply")}</button>${tab==="colors"?`<button class="gbtn" type="button" data-reset-colors>Reset</button>`:""}</div></form>`;
  }
  const m = openModal(`<h2><span>${I.gear.replace('<svg','<svg width="22" height="22"')} ${t("settings")}</span><button class="icon-btn" data-act="close" aria-label="${t("close")}">${I.x}</button></h2>
    <div class="tabs">${tabs.map(k=>`<button class="gbtn sm ${k===tab?"on":""}" data-stab="${k}">${t(tabNames[k])}</button>`).join("")}</div>${body}`, true);
  m.addEventListener("click", e=>{ const b=e.target.closest("[data-stab]"); if(b) openSettings(b.dataset.stab); });
  const form = m.querySelector("#stf");
  if(form){
    wireUploads(form);
    const rc = form.querySelector("[data-reset-colors]"); if(rc) rc.addEventListener("click",()=>{ form.elements["settings.c1"].value="#7898d4"; form.elements["settings.c2"].value="#d7a86e"; form.elements["settings.bg"].value="#090b12"; });
    if(tab==="colors") form.addEventListener("input", ()=>{ const r=document.documentElement; r.style.setProperty("--c1",form.elements["settings.c1"].value); r.style.setProperty("--c2",form.elements["settings.c2"].value); r.style.setProperty("--bg",form.elements["settings.bg"].value); });
    form.addEventListener("submit", ev=>{
      ev.preventDefault();
      const fs = TF[tab];
      fs.forEach(f=>{
        if(f.t==="bi"||f.t==="biarea") setP(S, f.k, {ar:form.elements[f.k+".ar"].value.trim(), en:form.elements[f.k+".en"].value.trim()});
        else setP(S, f.k, form.elements[f.k].value.trim());
      });
      if(tab==="cv"){ const nm = form.elements["settings.cvFileName"]; if(nm && nm.value) S.settings.cvName = nm.value; }
      closeModal(); markDirty(); toast("✓");
    });
  }
}

/* ---------------- save (publish this page with the new content) ---------------- */
function buildDoc(state){
  const css = document.getElementById("app-css").textContent;
  const js = document.getElementById("app-js").textContent;
  const json = JSON.stringify(state).replace(/</g,"\\u003c");
  return `<!DOCTYPE html>\n<html lang="ar" dir="rtl"><head>${HEAD}<style id="app-css">${css}</style></head><body><div id="root"></div><script type="application/json" id="app-state">${json}<\/script><script id="app-js">${js}<\/script></body></html>`;
}
async function save(){
  if(!caps.artifact){ toast(t("cantSave"), 5000); return; }
  const next = JSON.parse(JSON.stringify(S)); next.rev = (S.rev||1) + 1;
  const btn = $('[data-act="save"]'); if(btn){ btn.innerHTML = `<span class="spin"></span>${t("saving")}`; btn.disabled = true; }
  try{
    ss.set("mn_draft", JSON.stringify({rev:S.rev, state:S}));
    await caps.artifact.publish(buildDoc(next));
    ss.del("mn_draft"); dirty=false; S = next; toast(STATIC_BUILD ? t("savedStatic") : t("saved"), STATIC_BUILD ? 12000 : 2600); render();
  }catch(err){
    const c = err && err.code;
    if(c==="conflict") return;
    ss.set("mn_draft", JSON.stringify({rev:S.rev, state:S}));
    toast((c==="not_writer"||c==="not_granted"||c==="consent_required") ? t("cantSave") : ("⚠ " + (err&&(err.message||c)||"error")), 5000);
    render();
  }
}

/* ---------------- events ---------------- */
if(STATIC_BUILD) document.addEventListener("click", async e=>{
  const a = e.target.closest('a[href^="data:"]'); if(!a || a.hasAttribute("download")) return;
  e.preventDefault(); e.stopPropagation();
  const w = window.open("", "_blank");
  const u = URL.createObjectURL(await (await fetch(a.href)).blob());
  if(w) w.location = u; else location.href = u;
}, true);
document.addEventListener("click", e=>{
  if(e.target.closest("#lb")) return;
  const navA = e.target.closest("a[data-nav]");
  if(navA){ e.preventDefault(); const h = navA.getAttribute("href"); if(location.hash===h) go(h); else location.hash = h; return; }
  if(e.target.matches("[data-mbg]")){ closeModal(); return; }
  const el = e.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act;
  if(a==="close"){ closeModal(); return; }
  if(a==="lang"){ lang = lang==="ar"?"en":"ar"; ls.set("mn_lang", lang); render(); return; }
  if(a==="burger"){ view.nav = !view.nav; render(); return; }
  if(a==="filter"){ view[el.dataset.k] = el.dataset.v; render(); return; }
  if(a==="lb"){ if(e.target.closest(".edit-tools")) return; openLB(lbSet(el.dataset.set), +el.dataset.i); return; }
  if(a==="post"){ openPost(el.dataset.id); return; }
  if(a==="lbpost"){ const p=S.posts.find(x=>x.id===el.dataset.id); closeModal(); openLB((p.media||[]).map(m=>({src:m.url,type:m.type,cap:L(p.title)})), +el.dataset.i); return; }
  if(a==="cv"){ currentPage="career"; if(location.hash==="#cv") go("#cv"); else location.hash="#cv"; return; }
  if(a==="dl"){ download(el.dataset.url, el.dataset.name); return; }
  if(a==="login"){ openLogin(); return; }
  if(!admin) return;
  e.preventDefault(); e.stopPropagation();
  if(a==="logout") logout();
  else if(a==="save") save();
  else if(a==="settings") openSettings(el.dataset.tab);
  else if(a==="settings-texts") openSettings("texts");
  else if(a==="edit-edu") openEdu();
  else if(a==="add") openEditor(el.dataset.col, null, el.dataset.section);
  else if(a==="edit") openEditor(el.dataset.col, el.dataset.id);
  else if(a==="del") confirmDel(el.dataset.col, el.dataset.id);
}, true);

/* ---------------- boot ---------------- */
render();
if(location.hash && !["#home","#art","#career",""].includes(location.hash)) go(location.hash);
initCaps();
})();
</script></body></html>
